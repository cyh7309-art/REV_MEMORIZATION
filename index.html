<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A4A">
<meta name="description" content="요한계시록(개역한글) 암송 훈련 도구 — 범위 선택, 암송 입력, 자동 채점, 오답 분석, 학습 기록">
<title>계시록 암송 트레이너</title>
<link rel="stylesheet" href="css/style.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%96%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="계시록 암송">
</head>
<body>

<a class="skip-link" href="#main">본문으로 건너뛰기</a>

<header class="app-header">
  <button class="hdr-brand" id="brandBtn" type="button" aria-label="홈으로 이동">
    <span class="hdr-mark" aria-hidden="true">📖</span>
    <span class="hdr-title">계시록 암송 트레이너</span>
  </button>
  <div class="hdr-right">
    <span class="hdr-streak" id="hdrStreak" title="연속 학습일"></span>
    <span class="hdr-badge" id="demoBadge" hidden>샘플 데이터</span>
  </div>
</header>

<div class="app-shell">

  <nav class="side-nav" aria-label="주 메뉴">
    <button class="nav-item" data-nav="home" type="button"><span class="nav-ico" aria-hidden="true">🏠</span><span>홈</span></button>
    <button class="nav-item" data-nav="select" type="button"><span class="nav-ico" aria-hidden="true">✍️</span><span>암송하기</span></button>
    <button class="nav-item" data-nav="favorites" type="button"><span class="nav-ico" aria-hidden="true">⭐</span><span>즐겨찾기</span></button>
    <button class="nav-item" data-nav="history" type="button"><span class="nav-ico" aria-hidden="true">📊</span><span>학습기록</span></button>
    <button class="nav-item" data-nav="settings" type="button"><span class="nav-ico" aria-hidden="true">⚙️</span><span>설정</span></button>
    <p class="side-foot">개역한글 · 요한계시록 22장 404절</p>
  </nav>

  <main id="main" class="main" tabindex="-1">
    <section class="screen" id="screen-home" hidden></section>
    <section class="screen" id="screen-select" hidden></section>
    <section class="screen" id="screen-memorize" hidden></section>
    <section class="screen" id="screen-result" hidden></section>
    <section class="screen" id="screen-favorites" hidden></section>
    <section class="screen" id="screen-history" hidden></section>
    <section class="screen" id="screen-settings" hidden></section>
    <section class="screen" id="screen-report" hidden></section>
  </main>

</div>

<nav class="bottom-nav" aria-label="주 메뉴(모바일)">
  <button class="nav-item" data-nav="home" type="button"><span class="nav-ico" aria-hidden="true">🏠</span><span>홈</span></button>
  <button class="nav-item" data-nav="select" type="button"><span class="nav-ico" aria-hidden="true">✍️</span><span>암송</span></button>
  <button class="nav-item" data-nav="favorites" type="button"><span class="nav-ico" aria-hidden="true">⭐</span><span>즐겨찾기</span></button>
  <button class="nav-item" data-nav="history" type="button"><span class="nav-ico" aria-hidden="true">📊</span><span>기록</span></button>
  <button class="nav-item" data-nav="settings" type="button"><span class="nav-ico" aria-hidden="true">⚙️</span><span>설정</span></button>
</nav>

<div class="toast-wrap" id="toastWrap" role="status" aria-live="polite"></div>

<div class="modal-back" id="modalBack" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle" class="modal-title"></h3>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot"><button class="btn btn-ghost" id="modalClose" type="button">닫기</button></div>
  </div>
</div>

<div class="busy" id="busy" hidden aria-live="polite"><div class="busy-box"><span class="spinner" aria-hidden="true"></span><span>채점하는 중…</span></div></div>

<script src="data/revelation_kor.js"></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/diff.js"></script>
<script src="js/scorer.js"></script>
<script src="js/statistics.js"></script>
<script src="js/srs.js"></script>
<script src="js/plan.js"></script>
<script src="js/voice.js"></script>
<script src="js/report.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
